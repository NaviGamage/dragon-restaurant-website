<!DOCTYPE html>
<html lang="en" data-bs-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>Staff dashboard | Dragon Restaurant</title>
  <script>document.documentElement.setAttribute("data-bs-theme", localStorage.getItem("dr_theme") || "light");</script>
  <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Marcellus&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <!-- Login -->
  <div id="loginView" class="container" hidden>
    <div class="panel login-box">
      <h1 class="h3 mb-1">Staff login</h1>
      <p class="text-muted">Enter the staff PIN to manage orders.</p>
      <form id="loginForm" novalidate>
        <label class="form-label" for="pin">PIN</label>
        <input class="form-control mb-3" id="pin" type="password" inputmode="numeric" autocomplete="current-password">
        <button class="btn btn-lacquer w-100" type="submit">Sign in</button>
      </form>
      <a class="d-block text-center mt-3" href="index.html">Back to the website</a>
    </div>
  </div>

  <!-- Dashboard -->
  <div id="dashView" hidden>
    <div class="admin-bar">
      <div class="container d-flex justify-content-between align-items-center flex-wrap gap-2">
        <h1>Dragon Restaurant, staff dashboard</h1>
        <div class="d-flex gap-2">
          <a class="btn btn-ghost btn-sm" href="index.html">View website</a>
          <button class="btn btn-gold btn-sm" id="logoutBtn" type="button">Sign out</button>
        </div>
      </div>
    </div>

    <div class="container pb-5">
      <div class="row g-3 mt-2" id="stats"></div>

      <div class="admin-tabs" role="tablist">
        <button class="chip active" data-tab="orders" role="tab">Orders</button>
        <button class="chip" data-tab="reservations" role="tab">Reservations</button>
        <button class="chip" data-tab="messages" role="tab">Messages</button>
        <button class="chip" data-tab="menu" role="tab">Menu availability</button>
        <button class="chip" data-tab="settings" role="tab">Data</button>
      </div>

      <div id="tabBody"></div>
    </div>
  </div>

  <script src="js/menuData.js"></script>
  <script src="js/store.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>
